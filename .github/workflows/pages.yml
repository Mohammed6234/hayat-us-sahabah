# (Pages enabled; redeploy trigger.) Publishes site/ (plus its generated site/data/) to GitHub Pages on every push to main.
# No build tools beyond Node: pipeline/build-site.mjs just wraps site/ into dist/.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['site/**', 'pipeline/build-site.mjs', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node pipeline/build-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
